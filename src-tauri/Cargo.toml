[package]
name = "sts2stats"
version = "1.1.0"
description = "Local Slay the Spire save analytics"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sts2stats_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
walkdir = "2"

[profile.release]
strip = "none"

[profile.release.build-override]
strip = "none"
