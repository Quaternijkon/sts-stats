name: Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:version
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Engine and importer tests
        run: pnpm test --reporter=default --reporter=junit --outputFile=unit-test-results.xml
      - run: pnpm verify:local
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Synthetic frontend and layout tests
        run: pnpm test:e2e --reporter=github,html,junit
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: playwright-results.xml
      - name: Upload synthetic test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-frontend-validation
          retention-days: 14
          if-no-files-found: warn
          path: |
            unit-test-results.xml
            playwright-results.xml
            playwright-report/
            test-results/
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    name: Rust (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:version
      - name: Build frontend for the native context
        run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
  check:
    needs: [frontend, native]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every supported platform and frontend check
        run: |
          test "$FRONTEND_RESULT" = success
          test "$NATIVE_RESULT" = success
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
